# Shared settings for every script in src/
seed: 42

data:
  openml_id: 4541
  target: readmit_30          # 1 = readmitted within 30 days ("<30"); ">30" and "NO" = 0
  group_col: patient_nbr      # used ONLY as `groups` for splitting, never as a feature
  id_cols: [encounter_id, patient_nbr]   # identifiers, removed from the features
  # discharge_disposition_id codes, from IDs_mapping.csv (UCI version of the dataset)
  death_discharge_ids: [11, 19, 20, 21]  # 11 expired; 19/20/21 expired at home / in a facility / place unknown
  hospice_discharge_ids: [13, 14]        # 13 hospice at home, 14 hospice in a medical facility
  exclude_hospice: true                  # decision justified in notebooks/01_eda.ipynb, section 7
  drop_gender_values: ["Unknown/Invalid"]  # 3 rows

split:
  # StratifiedGroupKFold: grouped by patient AND stratified on the target
  test_n_splits: 5   # 1 fold out of 5 -> test set (~20% of patients)
  val_n_splits: 5    # 1 fold out of 5 of what remains -> validation (~16%)

cv:
  n_splits: 5        # cross-validation inside the training set (Optuna)

fairness:
  sensitive_attribute: race
